name: content-lint

on:
  push:
    branches: [main]
  pull_request:

jobs:
  content-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      # The linter has no dependencies, so no install step is needed.
      - name: Check content against writing rules
        run: node scripts/content-lint.mjs
